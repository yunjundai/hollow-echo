<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hollow Echo — 類空洞騎士 2D 動作原型</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #06090f;
        color: #dce6f5;
        font-family: 'Segoe UI', 'Noto Sans TC', system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0e1726 0%, #05070c 100%);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 1280px;
        max-height: 720px;
        aspect-ratio: 16 / 9;
        box-shadow: 0 0 60px rgba(0, 0, 0, 0.9), 0 0 1px rgba(160, 195, 255, 0.25);
        background: #080c14;
      }
      #controls-hint {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        background: rgba(8, 13, 22, 0.78);
        border: 1px solid rgba(170, 200, 240, 0.2);
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.4px;
        color: #b7c8e0;
        pointer-events: none;
        white-space: nowrap;
        backdrop-filter: blur(4px);
      }
      #controls-hint kbd {
        display: inline-block;
        padding: 1px 6px;
        margin: 0 2px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: #eef5ff;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Cvz4yvOl.js"></script>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="controls-hint">
        <kbd>A/D</kbd> 或 <kbd>←/→</kbd> 移動
        · <kbd>Space</kbd>/<kbd>Z</kbd> 跳躍 / 二段跳 / 蹬牆跳
        · <kbd>J</kbd>/<kbd>X</kbd> 揮砍（配合 <kbd>W</kbd>/<kbd>S</kbd> 上下劈）
        · <kbd>K</kbd>/<kbd>Shift</kbd> 衝刺
        · <kbd>L</kbd>/<kbd>C</kbd> 長按凝聚靈魂回血
        · <kbd>E</kbd> 長椅存檔
        · <kbd>M</kbd> 靜音
      </div>
    </div>
  </body>
</html>
